[project]
name = "audio-streaming-adapter"
version = "0.1.0"
description = "Streaming audio adapter bridging Whisper embeddings to LLM generation."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.13.0",
    "datasets>=4.8.4",
    "ipykernel>=7.2.0",
    "ipywidgets>=8.1.8",
    "jupyterlab>=4.5.6",
    "jupyterlab-widgets>=3.0.16",
    "librosa>=0.11.0",
    "matplotlib>=3.10.8",
    "notebook>=7.5.5",
    "sacrebleu>=2.4.0",
    "torch>=2.11.0",
    "torchaudio>=2.11.0",
    "torchcodec>=0.11.0",
    "transformers>=5.5.0",
    "wandb>=0.25.1",
    "optuna>=4.0.0",
    "sentencepiece>=0.2.2",
    "protobuf>=7.34.1",
]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["adapter*", "dataset*", "encoder*", "llm*", "projector*"]
